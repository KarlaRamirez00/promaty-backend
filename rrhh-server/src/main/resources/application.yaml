server:
  port: ${RRHH_PORT}

spring:
  application:
    name: rrhh-server
  datasource:
    url: jdbc:postgresql://localhost:5432/promaty_rrhh
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    # data.sql debe correr despues del DDL de Hibernate, no antes.
    defer-datasource-initialization: true
    show-sql: true
  sql:
    init:
      # 'always': el default solo ejecuta scripts en BD embebidas, no en PostgreSQL.
      mode: always
      encoding: UTF-8

eureka:
  client:
    service-url:
      defaultZone: http://localhost:${EUREKA_PORT}/eureka/
  instance:
    prefer-ip-address: true

app:
  cors:
    # Lista separada por comas de origenes del frontend autorizados a llamar esta API desde el
    # navegador. Temporal mientras no exista gateway-server (ver docs/architecture.md) - ahi se
    # concentra en un solo lugar.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  # Misma clave con que authorizer-server firma el token; sin default para no commitear el secreto.
  secret: ${JWT_SECRET}
