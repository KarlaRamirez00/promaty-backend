server:
  port: ${RRHH_PORT}

spring:
  application:
    name: rrhh-server
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE_MB:20}MB
      max-request-size: ${FILE_MAX_REQUEST_SIZE_MB:110}MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/promaty_rrhh
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    # data.sql debe correr despues del DDL de Hibernate, no antes.
    defer-datasource-initialization: true
    show-sql: true
  sql:
    init:
      # 'always': el default solo ejecuta scripts en BD embebidas, no en PostgreSQL.
      mode: always
      encoding: UTF-8

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT}/eureka/
  instance:
    prefer-ip-address: true

jwt:
  # Misma clave con que authorizer-server firma el token; sin default para no commitear el secreto.
  secret: ${JWT_SECRET}

file:
  upload-dir: ${FILE_UPLOAD_DIR:/uploads}

rexplus:
  # 'stub': adaptador en proceso sin red (respaldo). 'http': consume el servicio externo rex-stub.
  mode: ${REXPLUS_MODE:stub}
  stub:
    force-error: ${REXPLUS_STUB_FORCE_ERROR:false}
  http:
    base-url: ${REXPLUS_BASE_URL:http://localhost:8090}
    # Sin default para no commitear el secreto; obligatoria solo con mode=http.
    api-key: ${REXPLUS_API_KEY:}
    connect-timeout-ms: ${REXPLUS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${REXPLUS_READ_TIMEOUT_MS:5000}
