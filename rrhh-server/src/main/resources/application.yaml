server:
  port: ${RRHH_PORT}

spring:
  application:
    name: rrhh-server
  datasource:
    url: jdbc:postgresql://localhost:5432/promaty_rrhh
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    # data.sql debe correr despues del DDL de Hibernate, no antes.
    defer-datasource-initialization: true
    show-sql: true
  sql:
    init:
      # 'always': el default solo ejecuta scripts en BD embebidas, no en PostgreSQL.
      mode: always
      encoding: UTF-8

eureka:
  client:
    service-url:
      defaultZone: http://localhost:${EUREKA_PORT}/eureka/
  instance:
    prefer-ip-address: true
