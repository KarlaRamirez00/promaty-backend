server:
  port: ${GATEWAY_PORT}

spring:
  application:
    name: gateway-server
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE_MB:20}MB
      max-request-size: ${FILE_MAX_REQUEST_SIZE_MB:110}MB

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT}/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

internal-api:
  secret: ${INTERNAL_API_SECRET}

session:
  cache-ttl-seconds: ${SESSION_CACHE_TTL_SECONDS:10}
  lookup-timeout-ms: ${SESSION_LOOKUP_TIMEOUT_MS:2000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
