services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  eureka-server:
    build:
      context: ./eureka-server
    environment:
      EUREKA_PORT: ${EUREKA_PORT}
    ports:
      - "${EUREKA_PORT}:${EUREKA_PORT}"

  user-server:
    build:
      context: .
      dockerfile: user-server/Dockerfile
    environment:
      USER_PORT: ${USER_PORT}
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
      EUREKA_PORT: ${EUREKA_PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "${USER_PORT}:${USER_PORT}"

  authorizer-server:
    build:
      context: .
      dockerfile: authorizer-server/Dockerfile
    environment:
      AUTH_PORT: ${AUTH_PORT}
      EUREKA_HOST: eureka-server
      EUREKA_PORT: ${EUREKA_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    depends_on:
      eureka-server:
        condition: service_started
      user-server:
        condition: service_started
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"

  rrhh-server:
    build:
      context: .
      dockerfile: rrhh-server/Dockerfile
    environment:
      RRHH_PORT: ${RRHH_PORT}
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
      EUREKA_PORT: ${EUREKA_PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "${RRHH_PORT}:${RRHH_PORT}"

  gateway-server:
    build:
      context: .
      dockerfile: gateway-server/Dockerfile
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
      EUREKA_HOST: eureka-server
      EUREKA_PORT: ${EUREKA_PORT}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      eureka-server:
        condition: service_started
      user-server:
        condition: service_started
      authorizer-server:
        condition: service_started
      rrhh-server:
        condition: service_started
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"

volumes:
  postgres_data:
