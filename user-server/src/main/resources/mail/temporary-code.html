<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{title}}</title>
<style>
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) {
  .page-bg { background-color: #0b1220 !important; }
  .card-bg { background-color: #111827 !important; }
  .text-main { color: #f3f4f6 !important; }
  .text-soft { color: #9ca3af !important; }
  .code-box { background-color: #1f2937 !important; }
  .code-text { color: #f9fafb !important; }
  .footer-line { border-top-color: #374151 !important; }
  .logo-light { display: none !important; }
  .logo-dark { display: block !important; }
}
</style>
</head>
<body class="page-bg" style="margin:0;padding:0;background-color:#f3f4f6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="page-bg" style="background-color:#f3f4f6;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" class="card-bg" style="width:100%;max-width:480px;background-color:#ffffff;border-radius:8px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;">
        <tr>
          <td style="padding:28px 32px 20px 32px;">
            <img class="logo-light" src="cid:{{logoLightId}}" alt="Promaty" width="158" height="49" style="display:block;border:0;">
            <img class="logo-dark" src="cid:{{logoDarkId}}" alt="Promaty" width="158" height="49" style="display:none;mso-hide:all;border:0;">
          </td>
        </tr>
        <tr>
          <td style="height:3px;line-height:3px;font-size:0;background-color:#DC2626;">&nbsp;</td>
        </tr>
        <tr>
          <td class="text-main" style="padding:28px 32px 0 32px;color:#1f2937;font-size:15px;line-height:22px;">
            <h1 class="text-main" style="margin:0 0 12px 0;font-size:22px;line-height:28px;color:#111827;">{{heading}}</h1>
            <p style="margin:0;">{{intro}}</p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td class="code-box" style="background-color:#f3f4f6;border-radius:8px;padding:14px 28px;">
                  <span class="code-text" style="font-family:'Courier New',Courier,monospace;font-size:30px;font-weight:bold;letter-spacing:6px;color:#111827;">{{code}}</span>
                </td>
              </tr>
            </table>
            <p class="text-soft" style="margin:12px 0 0 0;font-size:13px;color:#6b7280;">Este código es válido por {{minutes}} minutos y solo puede usarse una vez.</p>
          </td>
        </tr>
        {{steps}}
        <tr>
          <td style="padding:0 32px 28px 32px;">
            <div class="footer-line" style="border-top:1px solid #e5e7eb;padding-top:16px;font-size:13px;line-height:19px;">
              <span class="text-soft" style="color:#6b7280;">Si no esperabas este correo, puedes ignorarlo: tu cuenta no cambiará.</span>
            </div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
