server:
  port: ${USER_PORT}

spring:
  application:
    name: user-server
  mail:
    # Host, puerto, usuario y clave llegan por SPRING_MAIL_*. Spring Boot no activa auth ni STARTTLS solo, y
    # Gmail (587) exige ambos. Los timeouts evitan que un SMTP caido deje colgada la peticion.
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/promaty_user
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    # data.sql debe correr despues del DDL de Hibernate, no antes.
    defer-datasource-initialization: true
    show-sql: true
  sql:
    init:
      # 'always': el default solo ejecuta scripts en BD embebidas, no en PostgreSQL.
      mode: always
      encoding: UTF-8

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT}/eureka/
  instance:
    prefer-ip-address: true

mail:
  # false: LoggingEmailSender escribe el correo en el log (solo desarrollo). true: SmtpEmailSender, que
  # exige SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD en el entorno (Spring Boot los mapea solo).
  enabled: ${MAIL_ENABLED:false}
  from: ${MAIL_FROM:no-reply@promaty.local}

one-time-code:
  expiration-minutes: ${ONE_TIME_CODE_EXPIRATION_MINUTES:30}
  max-attempts: ${ONE_TIME_CODE_MAX_ATTEMPTS:5}
  recovery-cooldown-seconds: ${ONE_TIME_CODE_RECOVERY_COOLDOWN_SECONDS:60}

login:
  max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
  lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  attempt-retention-hours: ${LOGIN_ATTEMPT_RETENTION_HOURS:24}
  attempt-cleanup-cron: ${LOGIN_ATTEMPT_CLEANUP_CRON:0 0 * * * *}

internal-api:
  # Secreto que authorizer-server envia en X-Internal-Secret a /internal/**. next-secret es opcional y solo
  # sirve para rotar: se aceptan ambos mientras se actualizan los clientes. Sin valor valido la app no arranca.
  secret: ${INTERNAL_API_SECRET:}
  next-secret: ${INTERNAL_API_SECRET_NEXT:}

jwt:
  # Misma clave que usa authorizer-server para firmar. Cada servicio valida el token localmente
  # contra ella, sin llamar a authorizer (ver docs/rbac.md). Sin default: nunca commitear el secreto.
  secret: ${JWT_SECRET}
