server:
  port: ${USER_PORT}

spring:
  application:
    name: user-server
  datasource:
    url: jdbc:postgresql://localhost:5432/promaty_user
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:${EUREKA_PORT}/eureka/
  instance:
    prefer-ip-address: true

app:
  cors:
    # Lista separada por comas de origenes del frontend autorizados a llamar esta API desde el
    # navegador. Temporal mientras no exista gateway-server (ver docs/architecture.md) - ahi se
    # concentra en un solo lugar.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
