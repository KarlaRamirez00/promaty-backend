server:
  port: ${USER_PORT}

spring:
  application:
    name: user-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/promaty_user
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    # data.sql debe correr despues del DDL de Hibernate, no antes.
    defer-datasource-initialization: true
    show-sql: true
  sql:
    init:
      # 'always': el default solo ejecuta scripts en BD embebidas, no en PostgreSQL.
      mode: always
      encoding: UTF-8

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT}/eureka/
  instance:
    prefer-ip-address: true

mail:
  # false: LoggingEmailSender escribe el correo en el log (solo desarrollo). true: SmtpEmailSender, que
  # exige SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD en el entorno (Spring Boot los mapea solo).
  enabled: ${MAIL_ENABLED:false}
  from: ${MAIL_FROM:no-reply@promaty.local}

one-time-code:
  expiration-minutes: ${ONE_TIME_CODE_EXPIRATION_MINUTES:30}

jwt:
  # Misma clave que usa authorizer-server para firmar. Cada servicio valida el token localmente
  # contra ella, sin llamar a authorizer (ver docs/rbac.md). Sin default: nunca commitear el secreto.
  secret: ${JWT_SECRET}
